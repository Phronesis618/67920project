[project]
name = "67920-nuzlocke"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy==1.26.4",
  "gymnasium==0.29.1",
  "stable-baselines3==2.3.2",
  "sb3-contrib==2.3.0",
  "torch==2.5.0",
  "pyboy==2.4.0",
  "scikit-image==0.24.0",
  "matplotlib==3.9.2",
  "mediapy==1.2.2",
  "einops==0.8.0",
  "tensorboard==2.18.0",
]

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.8,<1"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "project_work/v2"]

[tool.ruff]
line-length = 100
target-version = "py311"
